# Coexistence override: run OmniHub behind an EXISTING reverse proxy
# (e.g. the host's nginx) instead of the bundled Caddy.
#
# The base compose makes Caddy the sole public entry point, binding host
# :80/:443. On a host that already terminates TLS there (nginx, another
# Caddy, a cloud LB), that collides. With this override you start only
# the `postgres` and `omnihub` services — Caddy is left out — and your
# existing proxy forwards the public hostname to the gateway:
#
#   docker compose -f deploy/docker-compose.yaml \
#       -f deploy/docker-compose.nginx.yaml \
#       --env-file deploy/.env up -d --build postgres omnihub
#
# The gateway is published on the loopback only; point your proxy at it,
# e.g. nginx:  proxy_pass http://127.0.0.1:8090;
# Keep OMNIHUB_TRUSTED_PROXIES covering the proxy hop (the compose
# default 172.16.0.0/12 covers the Docker bridge) so X-Forwarded-For is
# honoured.

services:
  omnihub:
    ports:
      - "127.0.0.1:8090:8080"
