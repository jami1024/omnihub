# Production deployment: gateway + PostgreSQL + Caddy reverse proxy.
#
# The OmniHub container reaches PostgreSQL over the internal Docker
# network as "postgres". Neither postgres nor omnihub is published on
# the host — Caddy is the sole entry point, terminating TLS for
# ${OMNIHUB_DOMAIN} via auto Let's Encrypt and forwarding plain HTTP
# to omnihub:8080.
#
# Usage:
#   cp deploy/.env.example deploy/.env
#   $EDITOR deploy/.env                          # set OMNIHUB_DOMAIN, secrets
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/.env up -d --build
#
# To follow logs:
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/.env logs -f
#
# To tear down (keeping data):
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/.env down
#
# To tear down AND delete the database volume:
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/.env down -v
#
# Container / volume names are prefixed `omnihub-prod-*` so the
# production stack can coexist on the same host as the development
# postgres started by docker-compose.dev.yaml.

name: omnihub-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnihub-prod-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-omnihub}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnihub} -d ${POSTGRES_DB:-omnihub}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - omnihub_prod_pg_data:/var/lib/postgresql/data
    # No `ports:` — DB stays on the internal Docker network only.

  omnihub:
    # Build locally from source for the first deploy. Once the image
    # is pushed to GHCR, swap `build:` for `image:` to skip rebuilds.
    build:
      context: ..
      dockerfile: Dockerfile
    image: omnihub:${OMNIHUB_VERSION:-local}
    container_name: omnihub-prod-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OMNIHUB_LISTEN: ":8080"
      OMNIHUB_DATABASE_URL: "postgres://${POSTGRES_USER:-omnihub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnihub}?sslmode=disable"
      OMNIHUB_API_KEYS: ${OMNIHUB_API_KEYS:?OMNIHUB_API_KEYS must be set in deploy/.env}
      # JWT signing secret for the /admin web UI. Without it the gateway
      # refuses to mount /admin (see mountAdminRoutes), so the console is
      # unreachable. Generate with `openssl rand -hex 32`.
      OMNIHUB_ADMIN_JWT_SECRET: ${OMNIHUB_ADMIN_JWT_SECRET:?OMNIHUB_ADMIN_JWT_SECRET must be set in deploy/.env}
      # AES-256 key (base64 of 32 bytes) that encrypts account secrets at
      # rest. Empty = encryption disabled (plaintext, legacy). Generate
      # with `openssl rand -base64 32`. WARNING: losing this key makes
      # already-encrypted credentials unrecoverable.
      OMNIHUB_ENCRYPTION_KEY: ${OMNIHUB_ENCRYPTION_KEY:-}
      # Upstream credentials. Set the block matching your provider.
      OMNIHUB_ANTHROPIC_API_KEY: ${OMNIHUB_ANTHROPIC_API_KEY:-}
      OMNIHUB_CLAUDE_PLATFORM_API_KEY: ${OMNIHUB_CLAUDE_PLATFORM_API_KEY:-}
      OMNIHUB_CLAUDE_PLATFORM_REGION: ${OMNIHUB_CLAUDE_PLATFORM_REGION:-}
      OMNIHUB_CLAUDE_PLATFORM_WORKSPACE_ID: ${OMNIHUB_CLAUDE_PLATFORM_WORKSPACE_ID:-}
      # Circuit-breaker overrides (optional; empty value keeps the
      # built-in default — see deploy/.env.example).
      OMNIHUB_CIRCUIT_FAILURE_THRESHOLD: ${OMNIHUB_CIRCUIT_FAILURE_THRESHOLD:-}
      OMNIHUB_CIRCUIT_OPEN_DURATION: ${OMNIHUB_CIRCUIT_OPEN_DURATION:-}
      OMNIHUB_CIRCUIT_HALF_OPEN_SUCCESS: ${OMNIHUB_CIRCUIT_HALF_OPEN_SUCCESS:-}
      # Active health probes (optional; off by default, opt-in per account).
      OMNIHUB_HEALTH_PROBE_ENABLED: ${OMNIHUB_HEALTH_PROBE_ENABLED:-}
      OMNIHUB_HEALTH_PROBE_INTERVAL: ${OMNIHUB_HEALTH_PROBE_INTERVAL:-}
      OMNIHUB_HEALTH_PROBE_CONCURRENCY: ${OMNIHUB_HEALTH_PROBE_CONCURRENCY:-}
      OMNIHUB_SESSION_TTL: ${OMNIHUB_SESSION_TTL:-}
      # Prepaid-balance billing: when true, a portal-owned key whose
      # balance has reached zero is rejected with 402. Off by default.
      OMNIHUB_BILLING_ENABLED: ${OMNIHUB_BILLING_ENABLED:-false}
      # Observability + alerting (see deploy/.env.example).
      OMNIHUB_METRICS_TOKEN: ${OMNIHUB_METRICS_TOKEN:-}
      OMNIHUB_ALERT_WEBHOOK_URL: ${OMNIHUB_ALERT_WEBHOOK_URL:-}
      OMNIHUB_ALERT_FEISHU_URL: ${OMNIHUB_ALERT_FEISHU_URL:-}
      OMNIHUB_ALERT_DINGTALK_URL: ${OMNIHUB_ALERT_DINGTALK_URL:-}
      OMNIHUB_ALERT_THROTTLE: ${OMNIHUB_ALERT_THROTTLE:-}
      # Caddy is the only proxy in front; trust its container so
      # X-Forwarded-For survives. The "172.16.0.0/12" CIDR covers the
      # default Docker bridge network range.
      OMNIHUB_TRUSTED_PROXIES: ${OMNIHUB_TRUSTED_PROXIES:-172.16.0.0/12}
      OMNIHUB_ALLOWED_CLIENT_UA_PREFIXES: ${OMNIHUB_ALLOWED_CLIENT_UA_PREFIXES:-}
    # No `ports:` — Caddy is the only public entry point.

  caddy:
    image: caddy:2-alpine
    container_name: omnihub-prod-caddy
    restart: unless-stopped
    depends_on:
      - omnihub
    environment:
      OMNIHUB_DOMAIN: ${OMNIHUB_DOMAIN:?OMNIHUB_DOMAIN must be set in deploy/.env (e.g. api.example.com)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - omnihub_prod_caddy_data:/data         # certificates + ACME state
      - omnihub_prod_caddy_config:/config     # autosaved config

volumes:
  omnihub_prod_pg_data:
  omnihub_prod_caddy_data:
  omnihub_prod_caddy_config:
