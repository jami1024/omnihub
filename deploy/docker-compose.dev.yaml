# Local development PostgreSQL.
#
# Usage:
#   docker compose -f deploy/docker-compose.dev.yaml up -d
#   export OMNIHUB_DATABASE_URL='postgres://omnihub:omnihub@localhost:5432/omnihub?sslmode=disable'
#   go run ./cmd/omnihub
#
# Data lives in a named volume (omnihub_pg_data) so containers can be
# recreated without losing development state. Bind to 127.0.0.1 only so
# the database is never accidentally exposed to the network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnihub-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: omnihub
      POSTGRES_PASSWORD: omnihub
      POSTGRES_DB: omnihub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnihub -d omnihub"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - omnihub_pg_data:/var/lib/postgresql/data

volumes:
  omnihub_pg_data:
